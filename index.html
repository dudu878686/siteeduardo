<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ColdShot - 3D FPS Game</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; font-family: 'Segoe UI', Tahoma, sans-serif; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #000; color: #fff; }
        
        .screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 10; }
        .hidden { display: none !important; }

        /* Splash Screen */
        #splash-screen { background: #000; z-index: 50; }
        #splash-screen h1 { font-size: 5rem; letter-spacing: 8px; color: #ffcc00; text-shadow: 0 0 20px rgba(255, 204, 0, 0.6); animation: fadeIn 2s forwards; }

        /* Loading Screen */
        #loading-screen { background: #111; z-index: 40; }
        .loading-title { font-size: 2rem; margin-bottom: 20px; text-transform: uppercase; }
        .progress-box { width: 300px; height: 20px; border: 2px solid #ffcc00; border-radius: 10px; padding: 2px; }
        .progress-bar { width: 0%; height: 100%; background: #ffcc00; border-radius: 6px; transition: width 0.1s; }
        .progress-text { margin-top: 10px; font-weight: bold; color: #ffcc00; }

        /* Main Menu */
        #main-menu { background: #1a1a1a; align-items: flex-start; padding-left: 80px; z-index: 30; }
        .menu-title { font-size: 4rem; color: #ffcc00; margin-bottom: 10px; }
        .menu-subtitle { font-size: 1.2rem; color: #aaa; margin-bottom: 30px; }
        .gems-display { position: absolute; top: 30px; right: 40px; background: rgba(0,0,0,0.7); border: 1px solid #ffcc00; padding: 10px 20px; border-radius: 20px; font-size: 1.2rem; color: #00ffcc; font-weight: bold; }
        .menu-btn { width: 220px; padding: 15px; margin: 10px 0; background: #ffcc00; border: none; font-size: 1.1rem; font-weight: bold; cursor: pointer; border-radius: 5px; transition: 0.2s; text-transform: uppercase; }
        .menu-btn:hover { background: #fff; transform: scale(1.05); }

        /* Shop Screen */
        #shop-screen { background: rgba(15, 15, 15, 0.95); z-index: 35; }
        .shop-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; max-width: 800px; max-height: 400px; overflow-y: auto; padding: 10px; margin-bottom: 20px; }
        .shop-item { background: #222; border: 1px solid #444; padding: 15px; text-align: center; border-radius: 8px; }
        .shop-item h4 { margin-bottom: 10px; color: #ffcc00; }
        .shop-item button { background: #00ffcc; border: none; padding: 8px 15px; border-radius: 4px; font-weight: bold; cursor: pointer; color: #000; }

        /* HUD In-Game */
        #hud { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 5; }
        .crosshair { position: absolute; top: 50%; left: 50%; width: 8px; height: 8px; background: #00ffcc; border: 2px solid #000; border-radius: 50%; transform: translate(-50%, -50%); }
        .stats { position: absolute; bottom: 20px; left: 20px; background: rgba(0,0,0,0.6); padding: 15px; border-radius: 8px; font-size: 1.1rem; }
        .scoreboard { position: absolute; top: 20px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.7); padding: 10px 20px; border-radius: 8px; text-align: center; }

        #game-canvas { width: 100%; height: 100%; display: block; }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <!-- 1. Tela de Apresentação -->
    <div id="splash-screen" class="screen">
        <h1>COLDSHOT</h1>
    </div>

    <!-- 2. Tela de Carregamento -->
    <div id="loading-screen" class="screen hidden">
        <div class="loading-title">Carregando Recursos...</div>
        <div class="progress-box"><div id="progress-bar" class="progress-bar"></div></div>
        <div id="progress-text" class="progress-text">1%</div>
    </div>

    <!-- 3. Menu Principal -->
    <div id="main-menu" class="screen hidden">
        <div class="gems-display">💎 Gemas: <span id="gems-count">0</span></div>
        <h1 class="menu-title">COLDSHOT</h1>
        <p class="menu-subtitle">Edição 3D | Operador Ativo</p>
        <button class="menu-btn" onclick="startGame('casual')">Modo Casual</button>
        <button class="menu-btn" onclick="startGame('ranked')">Modo Ranqueado</button>
        <button class="menu-btn" onclick="openShop()">Loja</button>
    </div>

    <!-- 4. Loja -->
    <div id="shop-screen" class="screen hidden">
        <h2>Loja de Equipamentos (100 Gemas cada)</h2>
        <div style="margin-bottom:15px; font-size: 0.9rem; color:#aaa;">Gemas disponíveis: <span id="shop-gems">0</span></div>
        <div class="shop-grid" id="shop-grid"></div>
        <button class="menu-btn" onclick="closeShop()">Voltar ao Menu</button>
    </div>

    <!-- 5. Interface do Jogo (HUD) -->
    <div id="hud" class="hidden">
        <div class="crosshair"></div>
        <div class="scoreboard">
            Inimigos Restantes: <span id="bot-count">5</span> | Modo: <span id="game-mode-display">-</span>
        </div>
        <div class="stats">
            <div>Vida: ❤️ <span id="health">100</span></div>
            <div>Arma: 🔫 <span id="weapon-name">AK-47</span></div>
            <div>Munição: 💣 <span id="ammo">30</span>/90</div>
        </div>
    </div>

    <!-- Canvas para Renderização 3D -->
    <canvas id="game-canvas"></canvas>

    <script>
        let gems = parseInt(localStorage.getItem('coldshot_gems')) || 0;
        let scene, camera, renderer, mode = 'casual';
        let bots = [], ammoPickups = [], player = { health: 100, weapon: 'AK-47', ammo: 30 };
        let isPlaying = false;
        
        let yaw = 0, pitch = 0;
        const mouseSensitivity = 0.002;
        const raycaster = new THREE.Raycaster();

        const shopItems = ["Camuflagem Urbana", "Camuflagem Deserto", "Tático Ártico", "Operador Neon"];

        window.onload = () => {
            document.getElementById('gems-count').innerText = gems;
            setTimeout(() => {
                document.getElementById('splash-screen').classList.add('hidden');
                document.getElementById('loading-screen').classList.remove('hidden');
                runLoadingAnimation();
            }, 1000);
        };

        function runLoadingAnimation() {
            let progress = 1;
            const pBar = document.getElementById('progress-bar');
            const pText = document.getElementById('progress-text');
            const interval = setInterval(() => {
                progress += 5;
                pBar.style.width = progress + '%';
                pText.innerText = progress + '%';
                if (progress >= 100) {
                    clearInterval(interval);
                    document.getElementById('loading-screen').classList.add('hidden');
                    document.getElementById('main-menu').classList.remove('hidden');
                }
            }, 30);
        }

        function openShop() {
            document.getElementById('shop-gems').innerText = gems;
            const grid = document.getElementById('shop-grid');
            grid.innerHTML = '';
            shopItems.forEach(item => {
                grid.innerHTML += `
                    <div class="shop-item">
                        <h4>${item}</h4>
                        <button onclick="buySkin('${item}')">Comprar (100💎)</button>
                    </div>
                `;
            });
            document.getElementById('main-menu').classList.add('hidden');
            document.getElementById('shop-screen').classList.remove('hidden');
        }

        function closeShop() {
            document.getElementById('shop-screen').classList.add('hidden');
            document.getElementById('main-menu').classList.remove('hidden');
        }

        function buySkin(name) {
            if (gems >= 100) {
                gems -= 100;
                localStorage.setItem('coldshot_gems', gems);
                document.getElementById('gems-count').innerText = gems;
                document.getElementById('shop-gems').innerText = gems;
                alert(`Item ${name} equipado!`);
            } else {
                alert("Gemas insuficientes!");
            }
        }

        function startGame(selectedMode) {
            mode = selectedMode;
            player.health = 100;
            player.ammo = 30;
            document.getElementById('health').innerText = player.health;
            document.getElementById('ammo').innerText = player.ammo;
            document.getElementById('main-menu').classList.add('hidden');
            document.getElementById('hud').classList.remove('hidden');
            document.getElementById('game-mode-display').innerText = mode.toUpperCase();
            
            init3DScene();
            isPlaying = true;
            animate();
        }

        function init3DScene() {
            const canvas = document.getElementById('game-canvas');
            renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);

            scene = new THREE.Scene();
            scene.background = new THREE.Color(mode === 'casual' ? 0x1a1a2e : 0x0f2027);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 1.6, 0);
            
            yaw = 0; pitch = 0;
            camera.rotation.set(0, 0, 0);

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
            dirLight.position.set(20, 40, 20);
            scene.add(dirLight);

            createMap();
            spawnBots();
            spawnAmmoPickups();
            setupControls();
        }

        function createMap() {
            const floorGeo = new THREE.PlaneGeometry(100, 100);
            const floorMat = new THREE.MeshStandardMaterial({ color: 0x222222 });
            const floor = new THREE.Mesh(floorGeo, floorMat);
            floor.rotation.x = -Math.PI / 2;
            scene.add(floor);

            for (let i = 0; i < 20; i++) {
                const boxGeo = new THREE.BoxGeometry(4, 4, 4);
                const boxMat = new THREE.MeshStandardMaterial({ color: 0x4444aa });
                const box = new THREE.Mesh(boxGeo, boxMat);
                box.position.set((Math.random() - 0.5) * 80, 2, (Math.random() - 0.5) * 80);
                scene.add(box);
            }
        }

        // Geração otimizada de skin aleatória pixelada via Canvas
        function generateRandomTexture() {
            const cvs = document.createElement('canvas');
            cvs.width = 16; cvs.height = 16;
            const ctx = cvs.getContext('2d');
            const baseHue = Math.floor(Math.random() * 360);

            for (let x = 0; x < 16; x++) {
                for (let y = 0; y < 16; y++) {
                    const lum = 30 + Math.random() * 40;
                    ctx.fillStyle = `hsl(${baseHue}, 60%, ${lum}%)`;
                    ctx.fillRect(x, y, 1, 1);
                }
            }
            // Adicionar detalhes de olho/rosto
            ctx.fillStyle = '#000';
            ctx.fillRect(3, 4, 3, 3); ctx.fillRect(10, 4, 3, 3);
            ctx.fillRect(4, 11, 8, 2);

            const tex = new THREE.CanvasTexture(cvs);
            tex.magFilter = THREE.NearestFilter;
            tex.minFilter = THREE.NearestFilter;
            return tex;
        }

        function createRandomCharacter() {
            const group = new THREE.Group();
            const skinTex = generateRandomTexture();
            const mat = new THREE.MeshStandardMaterial({ map: skinTex });

            // Cabeça
            const head = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.6, 0.6), mat);
            head.position.y = 1.6;
            group.add(head);

            // Tronco
            const torso = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.8, 0.3), mat);
            torso.position.y = 0.9;
            group.add(torso);

            // Pernas
            const lLeg = new THREE.Mesh(new THREE.BoxGeometry(0.25, 0.5, 0.25), mat);
            lLeg.position.set(-0.15, 0.25, 0);
            group.add(lLeg);

            const rLeg = new THREE.Mesh(new THREE.BoxGeometry(0.25, 0.5, 0.25), mat);
            rLeg.position.set(0.15, 0.25, 0);
            group.add(rLeg);

            // Braços estendidos (agressivos)
            const lArm = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.6, 0.2), mat);
            lArm.position.set(-0.4, 1.1, -0.2);
            lArm.rotation.x = -Math.PI / 2;
            group.add(lArm);

            const rArm = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.6, 0.2), mat);
            rArm.position.set(0.4, 1.1, -0.2);
            rArm.rotation.x = -Math.PI / 2;
            group.add(rArm);

            return group;
        }

        function spawnBots() {
            bots = [];
            for (let i = 0; i < 5; i++) {
                const bot = createRandomCharacter();
                bot.position.set((Math.random() - 0.5) * 60, 0, (Math.random() - 0.5) * 60);
                bot.userData = { hp: 150, maxHp: 150, lastAttack: 0 };

                // Barra de Vida
                const hpCanvas = document.createElement('canvas');
                hpCanvas.width = 128; hpCanvas.height = 16;
                const hpTexture = new THREE.CanvasTexture(hpCanvas);
                const hpSprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: hpTexture }));
                hpSprite.position.set(0, 2.1, 0);
                hpSprite.scale.set(1.5, 0.2, 1);

                bot.add(hpSprite);
                bot.userData.hpSprite = hpSprite;
                bot.userData.hpCanvas = hpCanvas;

                updateMobHpBar(bot);
                scene.add(bot);
                bots.push(bot);
            }
            document.getElementById('bot-count').innerText = bots.length;
        }

        function updateMobHpBar(bot) {
            const canvas = bot.userData.hpCanvas;
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, 128, 16);
            ctx.fillStyle = 'rgba(0,0,0,0.6)';
            ctx.fillRect(0, 0, 128, 16);
            ctx.fillStyle = '#ff3333';
            const pct = Math.max(0, bot.userData.hp / bot.userData.maxHp);
            ctx.fillRect(2, 2, 124 * pct, 12);
            bot.userData.hpSprite.material.map.needsUpdate = true;
        }

        function spawnAmmoPickups() {
            ammoPickups = [];
            const geo = new THREE.BoxGeometry(0.5, 0.3, 0.7);
            const mat = new THREE.MeshStandardMaterial({ color: 0xffaa00, roughness: 0.3 });

            for (let i = 0; i < 8; i++) {
                const box = new THREE.Mesh(geo, mat);
                box.position.set((Math.random() - 0.5) * 70, 0.15, (Math.random() - 0.5) * 70);
                scene.add(box);
                ammoPickups.push(box);
            }
        }

        const keys = {};
        function setupControls() {
            window.addEventListener('keydown', (e) => keys[e.code] = true);
            window.addEventListener('keyup', (e) => keys[e.code] = false);

            document.body.addEventListener('click', () => {
                if (isPlaying && document.pointerLockElement !== document.body) {
                    document.body.requestPointerLock();
                }
            });

            document.addEventListener('mousemove', (e) => {
                if (document.pointerLockElement === document.body && isPlaying) {
                    yaw -= e.movementX * mouseSensitivity;
                    pitch -= e.movementY * mouseSensitivity;
                    pitch = Math.max(-Math.PI / 2 + 0.1, Math.min(Math.PI / 2 - 0.1, pitch));

                    camera.rotation.order = 'YXZ';
                    camera.rotation.y = yaw;
                    camera.rotation.x = pitch;
                }
            });

            window.addEventListener('mousedown', (e) => {
                if (e.button === 0 && isPlaying && document.pointerLockElement === document.body) {
                    if (player.ammo > 0) {
                        player.ammo--;
                        document.getElementById('ammo').innerText = player.ammo;
                        checkHit();
                    }
                }
            });
        }

        function checkHit() {
            raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);
            const intersects = raycaster.intersectObjects(bots, true);

            if (intersects.length > 0) {
                let hitObj = intersects[0].object;
                while (hitObj.parent && hitObj.parent !== scene && !hitObj.userData.hp) {
                    hitObj = hitObj.parent;
                }

                if (hitObj.userData && hitObj.userData.hp !== undefined) {
                    hitObj.userData.hp -= 50;

                    if (hitObj.userData.hp <= 0) {
                        scene.remove(hitObj);
                        bots = bots.filter(b => b !== hitObj);
                        document.getElementById('bot-count').innerText = bots.length;

                        if (bots.length === 0) finishGame(true);
                    } else {
                        updateMobHpBar(hitObj);
                    }
                }
            }
        }

        function finishGame(victory) {
            isPlaying = false;
            document.exitPointerLock();

            if (victory) {
                gems += 50;
                localStorage.setItem('coldshot_gems', gems);
                document.getElementById('gems-count').innerText = gems;
                alert("Vitória! Você eliminou todos os alvos e ganhou 50 Gemas.");
            } else {
                alert("Derrota! Você foi eliminado pelos monstros.");
            }

            document.getElementById('hud').classList.add('hidden');
            document.getElementById('main-menu').classList.remove('hidden');
        }

        function animate() {
            if (!isPlaying) return;
            requestAnimationFrame(animate);

            // Controles de movimento do jogador
            const speed = 0.12;
            const moveVector = new THREE.Vector3();
            const forward = new THREE.Vector3(-Math.sin(yaw), 0, -Math.cos(yaw)).normalize();
            const right = new THREE.Vector3(Math.cos(yaw), 0, -Math.sin(yaw)).normalize();

            if (keys['KeyW']) moveVector.add(forward);
            if (keys['KeyS']) moveVector.sub(forward);
            if (keys['KeyD']) moveVector.add(right);
            if (keys['KeyA']) moveVector.sub(right);

            if (moveVector.lengthSq() > 0) {
                moveVector.normalize().multiplyScalar(speed);
                camera.position.add(moveVector);
            }

            // Mobs Agressivos: Andar em direção ao jogador e atacar
            const now = Date.now();
            bots.forEach(bot => {
                bot.lookAt(camera.position.x, bot.position.y, camera.position.z);
                const dir = new THREE.Vector3();
                bot.getWorldDirection(dir);
                bot.position.add(dir.multiplyScalar(0.04));

                const dist = bot.position.distanceTo(camera.position);
                if (dist < 1.5 && now - bot.userData.lastAttack > 1000) {
                    player.health -= 15;
                    document.getElementById('health').innerText = Math.max(0, player.health);
                    bot.userData.lastAttack = now;

                    if (player.health <= 0) {
                        finishGame(false);
                    }
                }
            });

            // Coleta de Cartuchos de Munição pelo mapa
            for (let i = ammoPickups.length - 1; i >= 0; i--) {
                const box = ammoPickups[i];
                box.rotation.y += 0.02;
                if (camera.position.distanceTo(box.position) < 1.8) {
                    player.ammo += 30;
                    document.getElementById('ammo').innerText = player.ammo;
                    scene.remove(box);
                    ammoPickups.splice(i, 1);
                }
            }

            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            if (camera && renderer) {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            }
        });
    </script>
</body>
</html>
